# main에 올리면 Cloudflare로 자동 배포
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, AJIT_INVITE_CODE  (docs/DEPLOY.md 참고)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AJIT_INVITE_CODE: ${{ secrets.AJIT_INVITE_CODE }}
    steps:
      - name: 설정 확인
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare 열쇠가 아직 없어서 배포를 건너뜁니다 (docs/DEPLOY.md 참고)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: 22
      - name: 설치
        if: steps.check.outputs.skip != '1'
        working-directory: worker
        run: npm ci
      - name: 화면 빌드 + 배포
        if: steps.check.outputs.skip != '1'
        working-directory: worker
        run: npm run deploy
      - name: 초대 코드 등록
        if: steps.check.outputs.skip != '1' && env.AJIT_INVITE_CODE != ''
        working-directory: worker
        run: echo "$AJIT_INVITE_CODE" | npx wrangler secret put INVITE_CODE
