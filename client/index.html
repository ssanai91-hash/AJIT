<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>아지트 위스키 바</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14100d">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-title">
      <span class="bar-name" id="barName">우리 바</span>
      <span class="online" id="onlineCount"></span>
    </div>
    <button class="chip" id="musicChip" type="button" aria-label="음악">
      <span class="note">♪</span><span id="musicTitle">음악</span>
    </button>
    <button class="chip ghost" id="menuBtn" type="button" aria-label="메뉴">⋯</button>
  </header>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <div id="game"></div>
      <div class="overlay" id="overlay"></div>
    </div>
    <div class="toast-banner" id="toastBanner" hidden>
      <span id="toastText"></span>
      <button type="button" id="toastJoin">참여하기</button>
    </div>
    <div class="demo-badge" id="demoBadge" hidden>체험판 · 친구들은 가상 친구예요</div>
  </div>

  <nav class="actions" id="actions">
    <button type="button" data-act="whisky"><i class="ico ico-bottle"></i>위스키</button>
    <button type="button" data-act="pour"><i class="ico ico-pour"></i>따르기</button>
    <button type="button" data-act="sip"><i class="ico ico-sip"></i>한 모금</button>
    <button type="button" data-act="toast" class="primary"><i class="ico ico-toast"></i>건배!</button>
    <button type="button" data-act="wave"><i class="ico ico-wave"></i>손인사</button>
  </nav>

  <section class="chat" id="chat" aria-live="polite"></section>

  <form class="composer" id="composer" autocomplete="off">
    <input id="chatInput" name="chatInput" maxlength="200" placeholder="한마디 하기" enterkeyhint="send">
    <button type="submit" id="sendBtn">보내기</button>
  </form>

  <div class="flash" id="flash" hidden></div>
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>

  <section class="entry" id="entry" hidden></section>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
